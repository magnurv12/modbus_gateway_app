name: modbus_gateway_app
description: >-
  Modbus Gateway — supervisório mobile (SCADA) para o ESP32 Modbus Gateway — sensores,
  atuadores, alarmes e explorador Modbus sobre REST + WebSocket.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Estado (cubit / MVVM)
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1

  # Injeção de dependência e navegação
  get_it: ^9.3.0
  go_router: ^18.0.1

  # Modelagem imutável e serialização
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Fluxo de erro funcional
  either_dart: ^1.0.0

  # Rede
  http: ^1.4.0
  web_socket_channel: ^3.0.3

  # Configuração (env + mapa da planta)
  yaml: ^3.1.3

  intl: ^0.20.2
  collection: ^1.19.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/env/
    - assets/plant/
